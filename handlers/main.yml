  ansible.builtin.command: /usr/local/bin/clone-repos-for-opengrok.sh
  notify: handler_run_opengrok_indexer
  become: true
  become_user: "{{ opengrok_owner }}"
  tags: ["ct-opengrok", "skip_ansible_lint"]
