- name: "HandlerRunOpengrokIndexer"
  ansible.builtin.command: /usr/local/bin/run-opengrok-indexer.sh
  become: true
  become_user: "{{ opengrok_owner }}"
  tags: ["ct-opengrok", "skip_ansible_lint"]
...
